appId: com.salehspace.wahb
---
# The secure runner begins this flow with a verified account fixture. It never
# stores credentials in source control.
- launchApp
- tapOn:
    id: 'account-entry'
- tapOn:
    id: 'account-saved'
- assertVisible: 'Saved'
- takeScreenshot: 'saved-library'
- tapOn:
    id: 'saved-feed-news'
- tapOn:
    id: 'saved-search'
- inputText: 'news'
- hideKeyboard
- back
- tapOn:
    id: 'account-settings'
- tapOn:
    id: 'settings-ui-language-ar'
- stopApp
- launchApp
- assertVisible: 'سمعيات'
- takeScreenshot: 'pods-rtl'
